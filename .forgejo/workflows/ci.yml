# Every job only calls build.sh, which holds the CI logic (design/04-testing.md, "CI shape").
name: CI

on:
  push:
    branches: [next]
  pull_request:
    branches: [next]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:11.0.100-rc.2
    steps:
      - name: Checkout
        run: git config --global --add safe.directory "$PWD" && git init -q && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" && git fetch -q --depth=1 origin "$GITHUB_SHA" && git checkout -q "$GITHUB_SHA"
      - name: Build
        run: ./build.sh build
      - name: Test
        run: ./build.sh test
      - name: API baseline
        run: ./build.sh api

  lexicons:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:11.0.100-rc.2
    steps:
      - name: Checkout
        run: git config --global --add safe.directory "$PWD" && git init -q && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" && git fetch -q --depth=1 origin "$GITHUB_SHA" && git checkout -q "$GITHUB_SHA"
      - name: Install Python
        run: apt-get update -qq && apt-get install -y -qq python3 > /dev/null
      - name: Lexicons
        run: ./build.sh lexicons

  aot:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:11.0.100-rc.2-aot
    steps:
      - name: Checkout
        run: git config --global --add safe.directory "$PWD" && git init -q && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" && git fetch -q --depth=1 origin "$GITHUB_SHA" && git checkout -q "$GITHUB_SHA"
      - name: Publish the AOT smoke app
        run: ./build.sh aot

  integration-pds:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:11.0.100-rc.2
    services:
      pds:
        image: ghcr.io/bluesky-social/pds:0.4.5037
        env:
          PDS_HOSTNAME: localhost
          PDS_DEV_MODE: "true"
          # A service container gets no volume and the PDS does not create its data directory.
          PDS_DATA_DIRECTORY: /tmp
          PDS_BLOBSTORE_DISK_LOCATION: /tmp/blocks
          PDS_ADMIN_PASSWORD: ci-admin-password
          # Fixed values: this server is torn down with the job.
          PDS_JWT_SECRET: 00112233445566778899aabbccddeeff
          PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout
        run: git config --global --add safe.directory "$PWD" && git init -q && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" && git fetch -q --depth=1 origin "$GITHUB_SHA" && git checkout -q "$GITHUB_SHA"
      - name: Wait for the PDS
        run: |
          for i in $(seq 1 60); do curl -sf http://pds:3000/xrpc/_health && exit 0; sleep 2; done
          echo "PDS did not become healthy in time"; exit 1
      - name: PDS integration tests
        run: ./build.sh integration-pds
        env:
          ATPROTO_PDS_URL: http://pds:3000
          ATPROTO_PDS_ADMIN_PASSWORD: ci-admin-password

  # Gets the Spaces reference PDS as a service container once a GA image exists.
  integration-spaces:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:11.0.100-rc.2
    steps:
      - name: Checkout
        run: git config --global --add safe.directory "$PWD" && git init -q && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" && git fetch -q --depth=1 origin "$GITHUB_SHA" && git checkout -q "$GITHUB_SHA"
      - name: Spaces integration tests
        run: ./build.sh integration-spaces

  aspire:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:11.0.100-rc.2
    steps:
      - name: Checkout
        run: git config --global --add safe.directory "$PWD" && git init -q && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" && git fetch -q --depth=1 origin "$GITHUB_SHA" && git checkout -q "$GITHUB_SHA"
      - name: Aspire manifest
        run: ./build.sh aspire

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:11.0.100-rc.2
    steps:
      - name: Checkout
        run: git config --global --add safe.directory "$PWD" && git init -q && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" && git fetch -q --depth=1 origin "$GITHUB_SHA" && git checkout -q "$GITHUB_SHA"
      - name: CHANGELOG entry
        run: ./build.sh changelog
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
