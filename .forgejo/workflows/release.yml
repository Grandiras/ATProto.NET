# Publishes a version: build.sh release builds, tests, packs, pushes and creates the release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.9.0-preview.1)'
        type: string
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:11.0.100-rc.2
    steps:
      - name: Checkout
        run: git config --global --add safe.directory "$PWD" && git init -q && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" && git fetch -q --depth=1 origin "$GITHUB_SHA" && git checkout -q "$GITHUB_SHA"
      - name: Install jq
        run: apt-get update -qq && apt-get install -y -qq jq > /dev/null
      - name: Release
        run: ./build.sh release "${VERSION:-${GITHUB_REF_NAME#v}}"
        env:
          VERSION: ${{ inputs.version }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          NUGET_ORG_API_KEY: ${{ secrets.NUGET_ORG_API_KEY }}
